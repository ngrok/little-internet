# little-internet — DHCP for the lab wire (eth0)
#
# Every node ships this file and the dnsmasq package, and no node hands out a
# single address until you say so. That's deliberate: a wire where nothing
# assigns identity is where lesson 02 starts, and a wire where something does is
# where it ends. Any node can play the server. The lesson happens to use a third
# Pi named pi-foo-dhcp, but nothing here is specific to it.
#
# Turning a node into the lab's DHCP server takes two steps:
#
#   1. Give this node a fixed identity on the lab wire. A DHCP server answers
#      *on an interface*, and answering means putting a frame on that interface
#      sourced from an address on the network it serves. A server with no
#      address of its own can't do that. The image ships an inert profile for
#      exactly this job:
#
#        sudo nmcli connection up eth-lab-static      # this node -> 10.10.0.254
#
#   2. Uncomment the dhcp-range line at the bottom of this file, then start the
#      service:
#
#        sudo systemctl enable --now dnsmasq
#
# To hand the role back: re-comment dhcp-range, `sudo systemctl disable --now
# dnsmasq`, and `sudo nmcli connection up eth-dhcp`. A reboot alone returns the
# interface to DHCP, because eth-lab-static never autoconnects.

# Serve the lab wire and nothing else. Without this, dnsmasq would also listen
# on wlan0, which is the management path this project keeps deliberately
# separate from the lab. bind-dynamic rather than bind-interfaces so the daemon
# copes with eth0 having no address yet, or the cable being unplugged, instead
# of failing at startup.
interface=eth0
bind-dynamic

# DHCP only. Port 0 turns the resolver off entirely, so this node hands out
# identities without also becoming the lab's name server. DNS is its own lesson,
# later, and leaving it off here keeps one variable out of lesson 02.
port=0

# The lab's address plan:
#
#   10.10.0.1-50   handed out by DHCP. Low and memorable, and the range includes
#                  .1 and .2 so a node can ask for the address matching its
#                  hostname. A requested address outside the pool gets refused,
#                  which is the usual reason that trick appears not to work.
#   10.10.0.254    this server, set by the eth-lab-static profile. Outside the
#                  pool on purpose: a DHCP server that can lease away its own
#                  address is a bad afternoon.
#   12h            lease time. Long enough to be boring, short enough that the
#                  valid_lft countdown in `ip addr` is worth looking at.
#
# Uncomment to start handing out addresses:
#dhcp-range=10.10.0.1,10.10.0.50,12h
